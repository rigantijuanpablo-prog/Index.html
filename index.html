<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riganti, Geiler & Márquez Alluralde - Abogados</title>
    <!-- Fuentes Tipográficas Premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS BASE Y VARIABLES --- */
        :root {
            --color-primario: #0b1426;   /* Azul noche corporativo */
            --color-secundario: #bda06a; /* Dorado satinado institucional */
            --color-fondo-claro: #f4f6f9;/* Gris ultra claro limpio */
            --color-texto-oscuro: #212529; /* Gris oxford para lectura cómoda */
            --color-texto-suave: #6c757d;  /* Gris neutro para subtítulos */
            --fuente-titulos: 'Cinzel', serif;
            --fuente-cuerpo: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--fuente-cuerpo);
            color: var(--color-texto-oscuro);
            background-color: #ffffff;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* --- MENÚ DE NAVEGACIÓN CORPORATIVO --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 20, 38, 0.98);
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(189, 160, 106, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .marca-estudio {
            text-decoration: none;
        }

        .nombre-estudio {
            color: #ffffff;
            font-family: var(--fuente-titulos);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .subtitulo-estudio {
            color: var(--color-secundario);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            display: block;
            margin-top: 2px;
            font-weight: 600;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--color-secundario);
        }

        /* --- SECCIÓN PRINCIPAL (HERO) --- */
        .hero-principal {
            min-height: 100vh;
            background: linear-gradient(rgba(11, 20, 38, 0.75), rgba(11, 20, 38, 0.9)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 20px 60px 20px;
        }

        .hero-principal h1 {
            font-family: var(--fuente-titulos);
            font-size: 2.8rem;
            color: #ffffff;
            font-weight: 400;
            max-width: 900px;
            line-height: 1.3;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .hero-principal p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 650px;
            margin-bottom: 45px;
        }

        .boton-premium {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid var(--color-secundario);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: transparent;
        }

        .boton-premium:hover {
            background-color: var(--color-secundario);
            color: var(--color-primario);
            box-shadow: 0 10px 20px rgba(189, 160, 106, 0.15);
        }

        /* --- ESTRUCTURA GENERAL DE SECCIONES --- */
        section {
            padding: 120px 10%;
            clear: both;
        }

        .encabezado-seccion {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 80px auto;
        }

        .encabezado-seccion h2 {
            font-family: var(--fuente-titulos);
            font-size: 2.2rem;
            color: var(--color-primario);
            font-weight: 500;
            margin-bottom: 15px;
        }

        .encabezado-seccion .linea-decorativa {
            width: 50px;
            height: 2px;
            background-color: var(--color-secundario);
            margin: 0 auto 20px auto;
        }

        .encabezado-seccion p {
            color: var(--color-texto-suave);
            font-size: 0.95rem;
        }

        /* --- SECCIÓN EL ESTUDIO --- */
        .contenedor-estudio {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .texto-estudio p {
            color: var(--color-texto-oscuro);
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: 400;
            text-align: justify;
        }

        .lista-valores {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .tarjeta-valor {
            border-left: 3px solid var(--color-secundario);
            padding-left: 25px;
        }

        .tarjeta-valor h4 {
            font-family: var(--fuente-titulos);
            font-size: 1.1rem;
            color: var(--color-primario);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .tarjeta-valor p {
            color: var(--color-texto-suave);
            font-size: 0.9rem;
        }

        /* --- SECCIÓN ÁREAS DE PRÁCTICA --- */
        .grid-practicas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .tarjeta-practica {
            background-color: #ffffff;
            padding: 45px 35px;
            border: 1px solid #e2e8f0;
            transition: all 0.4s ease;
        }

        .tarjeta-practica:hover {
            transform: translateY(-5px);
            border-color: var(--color-secundario);
            box-shadow: 0 20px 40px rgba(11, 20, 38, 0.04);
        }

        .tarjeta-practica h3 {
            font-family: var(--fuente-titulos);
            color: var(--color-primario);
            font-size: 1.25rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .tarjeta-practica p {
            color: var(--color-texto-suave);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* --- SECCIÓN CONTACTO --- */
        .contenedor-contacto {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 70px;
        }

        .info-contacto h3 {
            font-family: var(--fuente-titulos);
            font-size: 1.5rem;
            color: var(--color-primario);
            margin-bottom: 30px;
        }

        .bloque-dato {
            margin-bottom: 25px;
        }

        .bloque-dato label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-secundario);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .bloque-dato p {
            font-size: 0.95rem;
        }

        .formulario-contacto {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo-ancho {
            grid-column: span 2;
        }

        .formulario-contacto input, .formulario-contacto textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #e2e8f0;
            font-family: var(--fuente-cuerpo);
            font-size: 0.85rem;
            outline: none;
            background-color: var(--color-fondo-claro);
            transition: all 0.3s;
        }

        .formulario-contacto input:focus, .formulario-contacto textarea:focus {
            border-color: var(--color-secundario);
            background-color: #ffffff;
        }

        .boton-enviar {
            grid-column: span 2;
            padding: 16px;
            background-color: var(--color-primario);
            color: #ffffff;
            border: none;
            font-family: var(--fuente-cuerpo);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .boton-enviar:hover {
            background-color: #1a2a44;
        }

        /* --- PIE DE PÁGINA (FOOTER) --- */
        .bloques-footer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
        }

        .columna-footer h4 {
            font-family: var(--fuente-titulos);
            color: var(--color-secundario);
            font-size: 0.95rem;
              <!-- INTERACTIVIDAD Y OPTIMIZACIÓN VISUAL (JAVASCRIPT) -->
    <script>
        // 1. Reducción dinámica del menú superior al hacer scroll para mayor elegancia
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.style.padding = '15px 8%';
                header.style.backgroundColor = 'rgba(11, 20, 38, 0.99)';
                header.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.15)';
            } else {
                header.style.padding = '25px 8%';
                header.style.backgroundColor = 'rgba(11, 20, 38, 0.98)';
                header.style.boxShadow = '0 4px 30px rgba(0, 0, 0, 0.05)';
            }
        });

        // 2. Animación suave de aparición para las tarjetas de áreas de práctica (Scroll Reveal)
        const tarjetasPractica = document.querySelectorAll('.tarjeta-practica');
        
        const opcionesObservador = {
            threshold: 0.15,
            rootMargin: "0px 0px -40px 0px"
        };

        const observadorTarjetas = new IntersectionObserver(function(entradas, observador) {
            entradas.forEach(entrada => {
                if (!entrada.isIntersecting) return;
                entrada.target.style.opacity = '1';
                entrada.target.style.transform = 'translateY(0)';
                observadorTarjetas.unobserve(entrada.target);
            });
        }, opcionesObservador);

        tarjetasPractica.forEach(tarjeta => {
            tarjeta.style.opacity = '0';
            tarjeta.style.transform = 'translateY(30px)';
            tarjeta.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
            observadorTarjetas.observe(tarjeta);
        });

        // 3. Validación y feedback visual dinámico para el formulario de contacto institucional
        const formulario = document.querySelector('.formulario-contacto');
        if(formulario) {
            formulario.addEventListener('submit', function() {
                const boton = formulario.querySelector('.boton-enviar');
                boton.innerText = "Procesando...";
                boton.style.opacity = "0.7";
                boton.style.pointerEvents = "none";
            });
        }
    </script>
</body>
</html>
